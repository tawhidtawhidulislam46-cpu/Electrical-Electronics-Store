let lang=localStorage.getItem('lang')||'bn';
const t=k=>T[lang][k]||k;
function toggleLang(){lang=lang==='bn'?'en':'bn';localStorage.setItem('lang',lang);applyStatic();route()}
function applyStatic(){$('#s').placeholder=t('search_ph');$('#langBtn').textContent=lang==='bn'?'EN':'বাং';document.querySelectorAll('[data-k]').forEach(el=>el.textContent=t(el.dataset.k))}

const $=q=>document.querySelector(q),esc=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
let S={},C=[],P=[],cart=JSON.parse(localStorage.cart||'[]'),wish=JSON.parse(localStorage.wish||'[]'),cat=0,q='',qty=1;
const on=k=>S[k]===undefined||S[k]===true||S[k]==='1'||S[k]===1;
const cur=()=>S.currency||'৳',pr=p=>+(p.discount_price||p.price),sub=()=>cart.reduce((a,i)=>a+i.price*i.qty,0),dc=()=>+S.delivery_charge||0;
const imgs=p=>Array.isArray(p.images)?p.images:[];
const badge=()=>{const cc=cart.reduce((a,i)=>a+i.qty,0),wc=wish.length;$('#cn').style.display=cc?'block':'none';$('#cn').textContent=cc;$('#wn').style.display=wc?'block':'none';$('#wn').textContent=wc};
const save=()=>{localStorage.cart=JSON.stringify(cart);badge()},saveWish=()=>{localStorage.wish=JSON.stringify(wish);badge()};
const toggleWish=(e,id)=>{e.preventDefault();e.stopPropagation();const i=wish.indexOf(id);i>-1?wish.splice(i,1):wish.push(id);saveWish();const b=document.getElementById('wb'+id);if(b)b.classList.toggle('on')};
const card=p=>`<a class="pc" href="#/p/${p.id}"><button class="wb ${wish.includes(p.id)?'on':''}" id="wb${p.id}" onclick="toggleWish(event,${p.id})">${wish.includes(p.id)?'♥':'♡'}</button><img src="${esc(imgs(p)[0]||'')}" loading="lazy"><div class="pi"><b>${esc(p.name)}</b><div>${p.discount_price?`<s>${cur()}${p.price}</s> `:''}<span class="pp">${cur()}${pr(p)}</span></div>${p.stock>0&&p.stock<=5?`<div class="low">${lang==='bn'?'মাত্র '+p.stock+'টি বাকি!':'Only '+p.stock+' left!'}</div>`:''}</div></a>`;
function grid(){const g=$('#g');if(!g)return;const l=P.filter(p=>(!cat||p.category_id==cat)&&p.name.toLowerCase().includes(q.toLowerCase()));g.innerHTML=l.map(card).join('')||`<p>${t('no_products')}</p>`}

categories:()=>on('sec_categories_on')&&C.length?`<div class="sec-title">${esc(S.sec_categories_title||t('sec_categories_default'))}</div><div class="chips">${C.map(c=>`<button onclick="setc(${c.id})">${esc(c.name)}</button>`).join('')}</div>`:'',
featured:()=>on('sec_featured_on')&&P.some(p=>p.featured)?`<div class="sec-title">${esc(S.sec_featured_title||t('sec_featured_default'))}</div><div class="grid">${P.filter(p=>p.featured).map(card).join('')}</div>`:'',
new:()=>on('sec_new_on')?`<div class="sec-title">${esc(S.sec_new_title||t('sec_new_default'))}</div><div class="grid">${[...P].sort((a,b)=>b.id-a.id).slice(0,8).map(card).join('')}</div>`:'',

$('#v').innerHTML=`<div class="card"><button class="wb ${wish.includes(p.id)?'on':''}" style="position:static;float:right" id="wbd${p.id}" onclick="toggleWish(event,${p.id})">${wish.includes(p.id)?'♥':'♡'}</button>

<p style="white-space:pre-wrap">${esc(p.description)}</p>

<button class="btn o" style="width:auto;padding:8px 14px" onclick="shareProd(${p.id})">${t('share_btn')}</button></div>
<button class="btn o" ${out?'disabled':''} onclick="add(${p.id});alert(t('added_to_cart_msg'))">${t('add_to_cart')}</button>
<button class="btn" ${out?'disabled':''} onclick="add(${p.id});location.hash='#/checkout'">${t('buy_now')}</button></div>
${related.length?`<div class="sec-title">${t('related_products')}</div><div class="grid">${related.map(card).join('')}</div>`:''}
<div class="card"><h3>${t('reviews_title')}</h3><div id="revBox">…</div><form onsubmit="submitReview(event,${p.id})"><input name="rname" placeholder="${t('name_ph')}" required><select name="rating">${[5,4,3,2,1].map(n=>`<option value="${n}">${'⭐'.repeat(n)}</option>`).join('')}</select><textarea name="rcomment" placeholder="${t('comment_ph')}" required></textarea><button class="btn o">${t('submit_review_btn')}</button></form></div>`;
loadReviews(id)}
async function loadReviews(pid){const{data}=await sb.from('store_reviews').select().eq('product_id',pid).order('created_at',{ascending:false});
const revs=data||[];const box=$('#revBox');if(!box)return;
const avg=revs.length?(revs.reduce((a,r)=>a+r.rating,0)/revs.length).toFixed(1):null;
box.innerHTML=(avg?`<div style="font-size:16px;margin-bottom:6px">⭐ ${avg} (${revs.length}${t('reviews_count')})</div>`:'')+
(revs.map(r=>`<div class="rv"><b>${esc(r.name)}</b> ${'⭐'.repeat(r.rating)}<br>${esc(r.comment)}</div>`).join('')||`<p>${t('no_reviews_yet')}</p>`)}
async function submitReview(e,pid){e.preventDefault();const f=new FormData(e.target);const btn=e.target.querySelector('button');btn.disabled=true;
const{error}=await sb.from('store_reviews').insert({product_id:pid,name:f.get('rname'),rating:+f.get('rating'),comment:f.get('rcomment')});
btn.disabled=false;if(error){alert(error.message);return}e.target.reset();alert(t('review_submitted'));loadReviews(pid)}
function shareProd(id){const url=location.origin+location.pathname+'#/p/'+id;if(navigator.share)navigator.share({url});else{navigator.clipboard.writeText(url);alert(t('link_copied'))}}
function add(id){const p=P.find(x=>x.id==id),i=cart.find(x=>x.id==id);i?i.qty+=qty:cart.push({id,name:p.name,price:pr(p),img:imgs(p)[0]||'',qty});save()}
const chg=(i,d)=>{cart[i].qty+=d;if(cart[i].qty<1)cart.splice(i,1);save();cartv()};
function wishv(){const items=P.filter(p=>wish.includes(p.id));$('#v').innerHTML=`<div class="sec-title">${t('my_wishlist')}</div><div class="grid">${items.map(card).join('')||`<p>${t('wishlist_empty')}</p>`}</div>`}
function cartv(){if(!cart.length){$('#v').innerHTML=`<div class="card">${t('cart_empty')}</div>`;return}
$('#v').innerHTML=cart.map((i,n)=>`<div class="card row"><img src="${esc(i.img)}" width="60" style="border-radius:8px"><div>${esc(i.name)}<br>${cur()}${i.price}</div><div class="q"><button onclick="chg(${n},-1)">−</button> ${i.qty} <button onclick="chg(${n},1)">+</button></div><b>${cur()}${i.price*i.qty}</b><button onclick="cart.splice(${n},1);save();cartv()">✕</button></div>`).join('')+`<div class="card"><div class="oi"><span>${t('product_total')}</span><b>${cur()}${sub()}</b></div><div class="oi"><span>${t('delivery_charge_label')}</span><b>${cur()}${dc()}</b></div><div class="oi tot"><span>${t('grand_total')}</span><b>${cur()}${sub()+dc()}</b></div></div><a class="btn" href="#/checkout">${t('checkout_btn')}</a>`}
function chk(){if(!cart.length){location.hash='#/cart';return}
const pms=[on('bkash_on')&&'bKash',on('nagad_on')&&'Nagad',on('rocket_on')&&'Rocket'].filter(Boolean);
$('#v').innerHTML=`<form class="card" onsubmit="place(event)"><h3>${t('delivery_info_title')}</h3><input name="name" placeholder="${t('name_ph')}" required><input name="mobile" type="tel" placeholder="${t('mobile_ph')}" required>
<select id="divSel" onchange="fillDistricts()" required><option value="">${t('division_ph')}</option>${Object.keys(BD).map(d=>`<option>${d}</option>`).join('')}</select>
<select name="district" id="distSel" required><option value="">${t('district_wait_ph')}</option></select>
<input name="area" placeholder="${t('area_ph')}" required><textarea name="address" placeholder="${t('address_ph')}" required></textarea><textarea name="note" placeholder="${t('note_ph')}"></textarea>
<h3>${t('order_summary_title')}</h3><div class="card" style="background:#fafafa">${cart.map(i=>`<div class="oi"><span>${esc(i.name)} × ${i.qty}</span><b>${cur()}${i.price*i.qty}</b></div>`).join('')}<div class="oi"><span>${t('product_total')}</span><b>${cur()}${sub()}</b></div><div class="oi"><span>${t('delivery_charge_label')}</span><b>${cur()}${dc()}</b></div><div class="oi"><span>${t('cod_label')}</span><b>${cur()}${sub()}</b></div><div class="oi tot"><span>${t('advance_now_label')}</span><b>${cur()}${dc()}</b></div></div>
<h3>${t('advance_payment_title')} ${cur()}${dc()}</h3><p>${pms.map(m=>`${m}: <b>${esc(S[m.toLowerCase()])}</b>`).join('<br>')}</p><p>${esc(S.pay_instructions)}</p>
<select name="pm">${pms.map(m=>`<option>${m}</option>`).join('')}</select>
<p style="font-size:13px;color:#777;margin:2px 0">${t('payment_note')}</p>
<input name="txn" id="txn" placeholder="Transaction ID"><input name="pmob" id="pmob" placeholder="${t('pmob_ph')}"><button class="btn">${t('order_btn')}</button></form>`}
function fillDistricts(){const list=BD[divSel.value]||[];distSel.innerHTML=`<option value="">${t('district_ph')}</option>`+list.map(d=>`<option>${d}</option>`).join('')}
async function place(e){e.preventDefault();const f=new FormData(e.target);const txn=f.get('txn').trim(),pmob=f.get('pmob').trim();
if(!txn&&!pmob){alert(t('payment_note'));return}
const b=e.target.querySelector('button');b.disabled=1;const no='ORD'+Date.now().toString(36).toUpperCase(),pt=sub();
const{error}=await sb.from('store_orders').insert({order_no:no,name:f.get('name'),mobile:f.get('mobile'),district:f.get('district'),area:f.get('area'),address:f.get('address'),note:f.get('note'),product_total:pt,delivery_charge:dc(),cod_amount:pt,grand_total:pt+dc(),pay_method:f.get('pm'),pay_amount:dc(),transaction_id:txn||null,payment_mobile:pmob||null,payment_status:'Pending Verification',status:'Pending Payment',items:cart.map(i=>({id:i.id,name:i.name,price:i.price,qty:i.qty}))});
if(error){alert(t('order_fail_prefix')+error.message);b.disabled=0;return}
const orderRow={order_no:no,name:f.get('name'),mobile:f.get('mobile'),district:f.get('district'),area:f.get('area'),address:f.get('address'),product_total:pt,delivery_charge:dc(),pay_amount:dc(),cod_amount:pt,grand_total:pt+dc(),pay_method:f.get('pm'),transaction_id:txn||null,payment_mobile:pmob||null,status:'Pending Payment'};
sb.functions.invoke('telegram-notify',{body:{type:'new',order:orderRow}}).catch(()=>{});
cart=[];save();location.hash='#/done/'+no}
const done=n=>$('#v').innerHTML=`<div class="card"><h2>${t('order_success_title')}</h2><p>${t('order_id_label')} <b>${esc(n)}</b></p><p>${t('order_success_msg')}${esc(S.phone)}</p><a class="btn o" href="#/track/${esc(n)}">${t('track_order_btn')}</a><a class="btn" href="#/">${t('shop_more_btn')}</a></div>`;
function track(no){$('#v').innerHTML=`<form class="card" id="tf"><h3>${t('track_title')}</h3><input name="no" placeholder="${t('order_id_ph')}" value="${esc(no||'')}" required><input name="mobile" placeholder="${t('track_mobile_ph')}" required><button class="btn">${t('search_btn')}</button></form><div id="tr"></div>`;
tf.onsubmit=async e=>{e.preventDefault();tr.innerHTML=t('searching_msg');const f=new FormData(tf);const{data,error}=await sb.rpc('store_track_order',{p_order_no:f.get('no').trim(),p_mobile:f.get('mobile').trim()});
if(error||!data||!data.length){tr.innerHTML=`<div class="card">${t('no_order_found')}</div>`;return}
const o=data[0];tr.innerHTML=`<div class="card"><b>${esc(o.order_no)}</b><br>${t('order_date_label')} ${new Date(o.created_at).toLocaleString()}<br>${t('payment_status_label')} <b>${esc(o.payment_status)}</b><br>${t('order_status_label')} <b>${esc(o.status)}</b>
${o.courier_name?`<br>${t('courier_label')} <b>${esc(o.courier_name)}</b>`:''}${o.tracking_id?`<br>${t('tracking_id_label')} <b>${esc(o.tracking_id)}</b>`:''}
${o.tracking_url?`<a class="btn o" href="${esc(o.tracking_url)}" target="_blank">${t('track_courier_btn')}</a>`:''}</div>`};
if(no)tf.dispatchEvent(new Event('submit'))}
function legal(page){const map={privacy:[t('privacy_policy'),S.privacy_text],terms:[t('terms'),S.terms_text],about:[t('about_us'),S.about_text]};const[title,text]=map[page]||['',''];
$('#v').innerHTML=`<div class="card"><h2>${esc(title)}</h2><p style="white-space:pre-wrap">${esc(text||t('no_content_yet'))}</p></div>`}
function setActiveNav(r){['nc','nw','nh','ncart','nt'].forEach(id=>$('#'+id).classList.remove('on'));const m={categories:'nc',wishlist:'nw','':'nh',cart:'ncart',track:'nt'};const id=m[r]||'nh';$('#'+id).classList.add('on')}
function route(){const h=location.hash.slice(2).split('/');scrollTo(0,0);setActiveNav(h[0]);({p:prod,categories:categoriesPage,wishlist:wishv,cart:cartv,checkout:chk,done,track,legal}[h[0]]||home)(h[1])}
(async()=>{const[s,c,p]=await Promise.all([sb.from('store_settings').select(),sb.from('store_categories').select().eq('visible',true).order('sort'),sb.from('store_products').select().eq('visible',true).order('id',{ascending:false})]);
S=Object.fromEntries((s.data||[]).map(r=>[r.key,r.value]));C=c.data||[];P=p.data||[];
document.title=S.site_name||'Drone Store';$('#sn').textContent=S.site_name||'';if(S.logo_url){lg.src=S.logo_url;lg.hidden=false}
if(S.favicon_url){const l=document.createElement('link');l.rel='icon';l.href=S.favicon_url;document.head.append(l)}
document.documentElement.style.setProperty('--cols',S.cols_mobile||2);document.documentElement.style.setProperty('--colsd',S.cols_desktop||4);
document.documentElement.style.setProperty('--c',S.primary_color||'#e8590c');document.documentElement.style.setProperty('--r',(S.radius||12)+'px');
if(on('notice_on')&&S.notice)$('#noticebar').innerHTML=`<div class="notice">${esc(S.notice)}</div>`;
$('#ft').innerHTML=on('footer_on')?`<div class="fn">${esc(S.site_name||'')}</div><div class="fl">`+[S.address&&`📍 ${esc(S.address)}`,S.phone&&`📞 ${esc(S.phone)}`,S.messenger_page&&`<a href="https://m.me/${esc(S.messenger_page)}">💬 Messenger</a>`,S.facebook&&`<a href="${esc(S.facebook)}">📘 Facebook</a>`,esc(S.footer)].filter(Boolean).join('<br>')+
`</div><div class="fl" style="margin-top:10px"><a href="#/legal/about">${t('about_us')}</a> · <a href="#/legal/privacy">${t('privacy_policy')}</a> · <a href="#/legal/terms">${t('terms')}</a></div>`+
`<div class="fl" style="margin-top:10px;font-size:13px;opacity:.7">© ${new Date().getFullYear()} ${esc(S.site_name||'')}. ${t('copyright_suffix')}</div>`:'';
applyStatic();badge();addEventListener('hashchange',route);route()})();
</script></body></html>
